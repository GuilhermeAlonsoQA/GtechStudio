name: Deploy Vercel

on:
  push:
    branches:
      - main
      - claude/gtech-studio-master-prompt-kowl8s
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::Secret VERCEL_TOKEN ainda não configurado — deploy pulado."
            exit 0
          fi
          npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee deploy.log
          echo "### URL do deploy" >> "$GITHUB_STEP_SUMMARY"
          grep -o 'https://[^ ]*\.vercel\.app' deploy.log | tail -1 >> "$GITHUB_STEP_SUMMARY"
